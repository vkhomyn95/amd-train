
  <form id="bulk-upload-form" class="audio-wave" action="/datasets/{{ dataset.id }}/upload" method="post"
                                      enctype="multipart/form-data">
  <div class="audio-wave-actions">
    <button id="play-btn" class="button button-primary" type="button">▶️ Програти</button>
    <button id="create-new-audio" class="button button-secondary" type="button">🎵 Створити аудіо з вибраних регіонів</button>
     <button class="button button-main" type="submit">
      {% include 'header/icons/icon-add.html' %}
      <span style="margin-left: 10px; color: #ffffff;" >Завантажити всі файли</span>
    </button>
  </div>
  <input type="file" name="files" multiple style="display:none">
  <input type="hidden" name="directory_folder" value="{{ current_directory.replace(base_directory + '/', '') }}">

  <div id="waveform" style="border: 1px solid #ccc; height: 128px;"></div>

  <ul id="generated-audios" class="file-list audio-wave-files">
  </ul>

</form>

<script type="module">
  import WaveSurfer from 'https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js';
  import RegionsPlugin from 'https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.esm.js';
  import Minimap from 'https://unpkg.com/wavesurfer.js@7/dist/plugins/minimap.esm.js';
  import TimelinePlugin from 'https://unpkg.com/wavesurfer.js@7/dist/plugins/timeline.esm.js';

  const generatedFiles = [];
  let selectedRegions = [];
  let isPlaying = false;
  let zoomLevel = 0;

  const regions = RegionsPlugin.create({
    dragSelection: {
      slop: 2,
    },
  });

  const minimap = Minimap.create({
    height: 20,
    waveColor: '#ddd',
    progressColor: '#999',
  });

  const timeline = TimelinePlugin.create({
    height: 10,
    timeInterval: 0.1,
    primaryLabelInterval: 1,
    style: {
      fontSize: '10px',
      color: '#6A3274',
    },
  });

  const wavesurfer = WaveSurfer.create({
    container: '#waveform',
    waveColor: '#ccc',
    progressColor: '#6c5ce7',
    height: 128,
    minPxPerSec: 100,
    dragToSeek: true,
    hideScrollbar: true,
    plugins: [regions, minimap, timeline],
  });

  document.getElementById('waveform').addEventListener('wheel', (e) => {
  e.preventDefault();

  const delta = e.deltaY;
  zoomLevel += delta > 0 ? -50 : 50;

  // Обмежити зум в межах від 10 до 1000
  zoomLevel = Math.max(10, Math.min(1000, zoomLevel));

  wavesurfer.zoom(zoomLevel);
});

  document.getElementById('audio-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (file) {
      const objectURL = URL.createObjectURL(file);
      await wavesurfer.load(objectURL);

      const dt = new DataTransfer();
      dt.items.add(file);
      document.getElementById('audio-upload-hidden').files = dt.files;
    }
  });

  document.getElementById('play-btn').addEventListener('click', () => {
    wavesurfer.playPause();
    isPlaying = !isPlaying;
    document.getElementById('play-btn').textContent = isPlaying ? '⏸️ Пауза' : '▶️ Програти';
  });


  regions.enableDragSelection({
  color: 'rgba(255, 0, 0, 0.1)',
})

  regions.on('region-created', (region) => {
  console.log('CREATED region', region);

  const index = selectedRegions.findIndex(r => r.id === region.id);
  if (index === -1) {
    selectedRegions.push(region);
  } else {
    selectedRegions[index] = region;
  }

  console.log('selectedRegions:', selectedRegions);
});

regions.on('region-updated', (region) => {
  console.log('Updated region', region);

  const index = selectedRegions.findIndex(r => r.id === region.id);
  if (index !== -1) {
    selectedRegions[index] = region;
  }

  console.log('selectedRegions:', selectedRegions);
});


  {
  let activeRegion = null
  regions.on('region-in', (region) => {
    console.log('region-in', region)
    activeRegion = region
  })
  regions.on('region-out', (region) => {
    console.log('region-out', region)
  })
  regions.on('region-clicked', (region, e) => {
    e.stopPropagation()
    activeRegion = region
    region.play(true)
  })
  wavesurfer.on('interaction', () => {
    activeRegion = null
  })
}

document.getElementById('create-new-audio').addEventListener('click', async () => {
  const audioBuffer = wavesurfer.getDecodedData();
  if (!audioBuffer) return;

  const context = new (window.AudioContext || window.webkitAudioContext)();
  const container = document.getElementById('generated-audios');
  const mainForm = document.getElementById('bulk-upload-form');

  // Очистити попередні результати
  container.innerHTML = '';

  for (const region of selectedRegions) {
    const startSample = Math.floor(region.start * audioBuffer.sampleRate);
    const endSample = Math.floor(region.end * audioBuffer.sampleRate);
    const length = endSample - startSample;

    const newBuffer = context.createBuffer(
      audioBuffer.numberOfChannels,
      length,
      audioBuffer.sampleRate
    );

    for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
      const channelData = audioBuffer.getChannelData(channel).slice(startSample, endSample);
      newBuffer.copyToChannel(channelData, channel);
    }

    // Експортуємо в WAV
    const wavBlob = bufferToWavBlob(newBuffer);
    const url = URL.createObjectURL(wavBlob);

    // Створюємо файл
    const file = new File(
      [wavBlob],
      `region-${Math.floor(region.start)}-${Math.floor(region.end)}.wav`,
      { type: 'audio/wav' }
    );

    // Додаємо файл до input[type=file]
    const dt = new DataTransfer();
    dt.items.add(file);

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.name = 'files'; // важливо!
    fileInput.style.display = 'none';
    fileInput.files = dt.files;

    // Додаємо input у головну форму
    mainForm.appendChild(fileInput);

    // UI: додаємо в список
    const li = document.createElement('li');
    li.className = 'audio-wave-file-item';

    const audio = document.createElement('audio');
    audio.controls = true;
    audio.src = url;

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'button button-danger remove-audio-btn';
    removeBtn.innerText = '🗑 Видалити';
    removeBtn.addEventListener('click', () => {
    li.remove();
    fileInput.remove();

    // Видалити регіон зі списку selectedRegions
    const regionIndex = selectedRegions.findIndex(
      r => Math.floor(r.start) === Math.floor(region.start) && Math.floor(r.end) === Math.floor(region.end)
    );
    if (regionIndex !== -1) {
      selectedRegions.splice(regionIndex, 1);
    }
  });

    li.appendChild(audio);
    li.appendChild(removeBtn);
    container.appendChild(li);
  }

  // Очищення регіонів
  regions.clearRegions();
});


// Допоміжна функція для конвертації AudioBuffer у WAV Blob
function bufferToWavBlob(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const format = 1; // PCM
  const bitDepth = 16;

  const samples = [];
  for (let channel = 0; channel < numChannels; channel++) {
    samples.push(buffer.getChannelData(channel));
  }

  const length = samples[0].length;
  const bufferLength = 44 + length * numChannels * 2;
  const arrayBuffer = new ArrayBuffer(bufferLength);
  const view = new DataView(arrayBuffer);

  // WAV заголовок
  writeString(view, 0, 'RIFF');
  view.setUint32(4, 36 + length * numChannels * 2, true);
  writeString(view, 8, 'WAVE');
  writeString(view, 12, 'fmt ');
  view.setUint32(16, 16, true); // PCM chunk size
  view.setUint16(20, format, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * 2, true); // byte rate
  view.setUint16(32, numChannels * 2, true); // block align
  view.setUint16(34, bitDepth, true);
  writeString(view, 36, 'data');
  view.setUint32(40, length * numChannels * 2, true);

  // WAV body
  let offset = 44;
  for (let i = 0; i < length; i++) {
    for (let channel = 0; channel < numChannels; channel++) {
      const s = Math.max(-1, Math.min(1, samples[channel][i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      offset += 2;
    }
  }

  return new Blob([arrayBuffer], { type: 'audio/wav' });
}

function writeString(view, offset, string) {
  for (let i = 0; i < string.length; i++) {
    view.setUint8(offset + i, string.charCodeAt(i));
  }
}

</script>
